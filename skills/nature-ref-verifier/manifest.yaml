name: nature-ref-verifier
version: 1.1.0
description: >
  Declarative manifest for venue-agnostic multi-source reference verification.
  Bibliographic identity/metadata verification is separate from target-journal
  rendering style. The legacy skill name is retained for compatibility.

always_load:
  - SKILL.md

references:
  on_demand:
    - condition: diagnosing recurring bibliography errors, field-level mismatch patterns, DOI/title conflicts, author-order anomalies, page-range drift, or batch report wording
      path: references/common-patterns.md
    - condition: user asks whether references/citations are formatted correctly for a named journal/style, requests journal transfer, target-specific bibliography formatting, in-text/reference cross-link audit, or metadata-versus-style distinction
      path: references/journal-style-audit.md
    - condition: exact target journal/article type/stage must be resolved for submission-ready reference rendering
      path: ../nature-shared/journal-formats/journal-resolution.md
