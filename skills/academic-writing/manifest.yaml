name: academic-writing
version: 1.13.0
description: >
  Canonical journal-agnostic academic manuscript writing router. The historical
  nature-writing directory remains a compatibility/reference implementation
  layer, while this public skill resolves archetype, evidence, whole-paper
  narrative architecture, section functional sufficiency, reader-state
  activation, writing logic, discussion depth, epistemic rhetoric, numerical
  display precision, figures/tables/visual representation, research, author
  voice, target adaptation, standalone zero-context reader independence,
  literature version and source quality, formal-spine preservation, scholarly
  surface semantics, evidence-graded publication optimization, editorial
  decision readiness, and final surface QA independently from Nature.

always_load:
  - ../nature-shared/core/reader-workflow.md
  - ../nature-shared/core/paper-type-taxonomy.md
  - ../nature-shared/core/paper-archetype-atlas.md
  - ../nature-shared/core/ethics.md
  - ../nature-shared/core/terminology-ledger.md
  - ../nature-shared/core/standalone-manuscript-reader-contract.md
  - ../nature-shared/core/manuscript-narrative-architecture.md
  - ../nature-shared/core/epistemic-rhetoric-and-qualification.md
  - ../nature-shared/core/numerical-reporting-precision.md
  - ../nature-shared/core/manuscript-excellence-release-gate.md
  - ../nature-shared/core/literature-version-and-source-quality.md
  - ../nature-shared/core/sentence-logic-and-cohesion.md
  - ../nature-shared/core/explanatory-sufficiency.md
  - ../nature-shared/core/manuscript-content-selection.md
  - ../nature-shared/core/formal-spine-preservation.md
  - ../nature-shared/core/study-protocol-conduct-contract.md
  - ../nature-shared/core/data-integrity-stewardship-contract.md
  - ../nature-shared/core/statistical-inference-uncertainty-contract.md
  - ../nature-shared/core/figure-evidence-planning.md
  - ../nature-shared/core/scientific-display-decision-contract.md
  - ../nature-shared/core/scholarly-surface-semantics.md
  - ../nature-shared/core/manuscript-surface-qa.md

references:
  on_demand:
    - condition: substantial manuscript or major rewrite needs a conservative scan for excessive decimal precision, fixed-width metric output, defensive qualification density, experiment/version-ID narrative density, or a suspiciously short setup/formulation section before manual narrative review
      path: ../nature-shared/scripts/audit_narrative_precision.py
    - condition: inspect the 2026-08-31 editorial, scientific-writing, statistical-reporting, and AI-academic-writing evidence behind narrative architecture, discussion, stance, and numerical-precision rules
      path: ../nature-shared/research/excellent-academic-writing-ai-failure-evidence-2026-08-31.md
    - condition: manuscript-facing source needs a conservative scan for project/private vocabulary, opaque experiment/version identifiers, machine terminal strings, repository paths/CLI commands, paper-series dependencies, or preprint concentration before a zero-context reader audit
      path: ../nature-shared/scripts/audit_standalone_manuscript.py
    - condition: manuscript-facing source needs a conservative scan for chat-style inline bold, code/monospace semantic leakage, internal enum/status labels, raw source-like math outside math mode, table numbering/caption anomalies, or overfull render-log signals
      path: ../nature-shared/scripts/audit_scholarly_surface_semantics.py
    - condition: full manuscript, theory/proof section, formal bound, public-posting/submission readiness, or decision-relevant rewrite needs fail-closed atomic claim, definition, proof, source, number, availability, and cross-section verification
      path: ../nature-shared/core/atomic-claim-verification.md
    - condition: current paper type, target, reporting norm, writing convention, figure grammar, or review expectation is unfamiliar/uncertain and research is needed before imposing a template
      path: ../nature-shared/core/unknown-paper-research-protocol.md
    - condition: decide whether scientific evidence belongs in text, a table, a figure, or a mixed display; choose a plot/table family; plan exact-value tables; or audit forest/funnel, survival, prediction, longitudinal, heatmap, compositional, map, qualitative, image, or diagram representation
      path: ../nature-shared/core/visual-evidence-atlas.md
    - condition: inspect the targeted 2026-08-29 research, source-specific support, transfer limits, and reasoning behind the visual-evidence atlas
      path: ../nature-shared/research/visual-evidence-atlas-research-2026-08-29.md
    - condition: substantial manuscript work should study a few genuinely close papers for argument/evidence/figure/explanation/local-convention calibration without copying wording or visual identity
      path: ../nature-shared/core/analogue-paper-calibration.md
    - condition: recent cross-archetype direct-reading examples are needed to test whether a proposed writing/figure rule is actually transferable
      path: ../nature-shared/research/stratified-paper-reading-2025-2026.md
    - condition: inspect the evidence, transfer limits, contradictions, or unresolved domain gaps behind a maintained study protocol/conduct adapter or blocker
      path: ../nature-shared/research/study-protocol-conduct-evidence-ledger-2026-08.md
    - condition: inspect the evidence, transfer limits, contradictions, or unresolved exact-domain gaps behind a data integrity/stewardship adapter, blocker, governance rule, or release route
      path: ../nature-shared/research/data-integrity-stewardship-evidence-ledger-2026-08.md
    - condition: inspect the evidence, contradictions, transfer limits, exact-policy boundary, or repair route behind a statistical inference/uncertainty adapter or blocker
      path: ../nature-shared/research/statistical-inference-uncertainty-evidence-ledger-2026-08.md
    - condition: prose feels generic, formulaic, machine-like, connector-heavy, repetitive, weakly authorial, or over-smoothed after the scientific logic is stable
      path: ../nature-shared/core/natural-scholarly-prose.md
    - condition: representative author prose exists and a recognizable manuscript-level voice should survive restructuring
      path: ../nature-shared/core/author-voice-profile.md
    - condition: target journal/venue, article type, stage, or exact current compliance requirements matter
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: target-specific editorial/reviewer criteria, acceptance objective, repair route, review model, AI/confidentiality policy, policy date, or decision readiness matters
      path: ../nature-shared/journal-formats/venue-decision-contract.md
    - condition: submission strategy needs journal-specific acceptance-readiness across scope, editorial triage, contribution/readership fit, evidence maturity, cover letter, reviewer expertise coverage, editor synthesis, revision closure, or retargeting without predicting acceptance
      path: ../nature-shared/core/journal-acceptance-readiness.md
    - condition: user wants to maximize legitimate publication opportunity, reduce preventable rejection, decide what can be engineered before versus after the study, compare Registered Report/standard routes, build a fit-first target ladder, or prioritize evidence-backed acceptance levers without numeric acceptance prediction
      path: ../nature-shared/core/acceptance-optimization-protocol.md
    - condition: learn how comparable accepted/revised papers actually changed during review by studying public Nature Communications, PLOS, eLife, TMLR/OpenReview histories, while pairing them with rejection evidence and treating visible revisions as non-causal heuristics
      path: ../nature-shared/core/public-review-history-calibration.md
    - condition: inspect evidence grades and source-specific support behind acceptance optimization, including rejection analyses, novelty/conventionality, statistical review, reporting review, Registered Reports, revision trajectories, review disagreement, cover letters and public-history limitations
      path: ../nature-shared/research/acceptance-optimization-evidence-ledger-2026-08-29.md
    - condition: public editor identities, teams, sections, subject coverage, or professional expertise are relevant to journal routing, conflicts, or a permitted editor suggestion; use only for expertise routing, never individual preference targeting
      path: ../nature-shared/core/editor-expertise-routing.md
    - condition: inspect current official/editorial and meta-research evidence behind desk triage, editor expertise routing, reviewer disagreement, cover-letter boundaries, novelty/acceptance, and anti-gaming safeguards
      path: ../nature-shared/research/journal-acceptance-editorial-decision-research-2026-08-29.md
    - condition: target publication model needs fallback classification for editor/reviewer preflight
      path: ../nature-shared/journal-formats/editorial-decision-profiles.md
    - condition: pre-submission editor/reviewer decision logic or minimum-sufficient repair planning is needed
      path: ../nature-shared/core/editor-reviewer-decision-engine.md
    - condition: Results/main-text work needs shortest-sufficient evidence chain, main-versus-support allocation, or revision-accretion control
      path: ../nature-shared/core/main-text-discipline.md
    - condition: full or multi-round manuscript needs terminology/unit/number/claim consistency checking
      path: ../nature-shared/core/consistency-sweep.md
