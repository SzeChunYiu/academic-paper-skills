name: academic-paper-pipeline
version: 1.12.0
description: >
  Declarative manifest for the journal-agnostic iterative academic-paper
  orchestration workflow. It coordinates research, writing, figures/tables/
  visual representation, statistics, formal-spine preservation, scholarly
  surface semantics, evidence-graded acceptance optimization, journal
  acceptance-readiness, independent review, editor synthesis, revision and
  re-review until simulated publication readiness or an explicit real-world
  blocker.

always_load:
  - ../nature-shared/core/academic-paper-iteration-pipeline.md
  - ../nature-shared/core/atomic-claim-verification.md
  - ../nature-shared/core/research-integrity-verification.md
  - ../nature-shared/core/formal-spine-preservation.md
  - ../nature-shared/core/editor-reviewer-decision-engine.md
  - ../nature-shared/core/journal-acceptance-readiness.md
  - ../nature-shared/core/acceptance-optimization-protocol.md
  - ../nature-shared/core/paper-archetype-atlas.md
  - ../nature-shared/core/unknown-paper-research-protocol.md
  - ../nature-shared/core/sentence-logic-and-cohesion.md
  - ../nature-shared/core/explanatory-sufficiency.md
  - ../nature-shared/core/manuscript-content-selection.md
  - ../nature-shared/core/study-protocol-conduct-contract.md
  - ../nature-shared/core/data-integrity-stewardship-contract.md
  - ../nature-shared/core/statistical-inference-uncertainty-contract.md
  - ../nature-shared/core/figure-evidence-planning.md
  - ../nature-shared/core/scientific-display-decision-contract.md
  - ../nature-shared/core/scholarly-surface-semantics.md
  - ../nature-shared/core/manuscript-surface-qa.md

references:
  on_demand:
    - condition: manuscript-facing source needs a conservative scan for chat-style inline bold, code/monospace semantic leakage, internal enum/status labels, raw source-like math outside math mode, table numbering/caption anomalies, or overfull render-log signals
      path: ../nature-shared/scripts/audit_scholarly_surface_semantics.py
    - condition: a full-manuscript, submission-ready, publication-ready, or other release decision needs machine-checkable claim/source provenance, citation entailment receipts, source identity/status refresh, or hallucination/adversarial verification
      path: ../nature-shared/analysis-contracts/research-integrity-ledger.schema.json
    - condition: a research-integrity ledger must be validated or DOI/PMID identity and retraction/status signals should be refreshed before release
      path: ../nature-shared/scripts/verify_research_integrity.py
    - condition: exact target journal/venue, article type, submission stage, editorial model or live author instructions matter
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: exact target decision criteria, policy effective date, burden-of-doubt rule, repair routes, review model, AI/confidentiality policy, acceptance states, or certification layer matters
      path: ../nature-shared/journal-formats/venue-decision-contract.md
    - condition: exact target publication objective needs fallback classification across selective broad-interest, field-advancement, rigor-first, clinical/policy-priority, evidence-assessment, or deadline-constrained models
      path: ../nature-shared/journal-formats/editorial-decision-profiles.md
    - condition: current project is prospective and the pipeline should test whether an exact target offers a Registered Report or another early-review publication route before results are known
      path: ../nature-shared/core/acceptance-optimization-protocol.md
    - condition: close public review histories should be studied for concern-to-repair patterns, revision deltas, claim narrowing, evidence additions, figure/table changes or persistent objections, with accepted histories paired against rejection evidence
      path: ../nature-shared/core/public-review-history-calibration.md
    - condition: source-specific evidence grades, causal limits, rejection analyses, Registered Report evidence, revision trajectories, statistical-review evidence, novelty/conventionality findings or public-history limitations behind acceptance optimization need inspection
      path: ../nature-shared/research/acceptance-optimization-evidence-ledger-2026-08-29.md
    - condition: public editor identities, sections, teams, professional expertise, conflicts, or a target-permitted editor suggestion are relevant to routing; use only professional expertise and official workflow rules, never inferred favorability
      path: ../nature-shared/core/editor-expertise-routing.md
    - condition: inspect the current official/editorial and meta-research evidence behind journal triage, editor routing, reviewer disagreement, cover letters, novelty, desk rejection, and anti-gaming boundaries
      path: ../nature-shared/research/journal-acceptance-editorial-decision-research-2026-08-29.md
    - condition: the manuscript needs a text-vs-table-vs-figure decision, exact-value table design, plot-family selection, visual evidence sequencing, or review of forest/funnel, longitudinal, survival, prediction, heatmap, compositional, geospatial, qualitative, image, or diagram displays
      path: ../nature-shared/core/visual-evidence-atlas.md
    - condition: source-specific visual-representation evidence or transfer limits from the 2026-08-29 research tranche need inspection before a revision or reviewer response
      path: ../nature-shared/research/visual-evidence-atlas-research-2026-08-29.md
    - condition: a few close papers should be studied deeply for current evidence, writing, explanation, figure and main-versus-support expectations
      path: ../nature-shared/core/analogue-paper-calibration.md
    - condition: author voice should be preserved through repeated rewrite rounds
      path: ../nature-shared/core/author-voice-profile.md
    - condition: prose sounds generic/machine-like or needs natural scholarly realization after logic is repaired
      path: ../nature-shared/core/natural-scholarly-prose.md
    - condition: current paper needs cross-archetype recent-paper counterexamples or deeper 2025-2026 descriptive calibration
      path: ../nature-shared/research/stratified-paper-reading-2025-2026.md
    - condition: a protocol/conduct adapter, blocker, repair route, or domain transfer boundary needs source-specific research inspection
      path: ../nature-shared/research/study-protocol-conduct-evidence-ledger-2026-08.md
    - condition: a data modality/governance adapter, integrity blocker, repair boundary, exact-policy gap, or release route needs source-specific research inspection
      path: ../nature-shared/research/data-integrity-stewardship-evidence-ledger-2026-08.md
    - condition: an analysis adapter, statistical blocker, uncertainty semantic, repair boundary, or exact analysis-policy gap needs source-specific research inspection
      path: ../nature-shared/research/statistical-inference-uncertainty-evidence-ledger-2026-08.md
    - condition: manuscript has undergone multiple rounds and needs terminology/unit/number/claim consistency checking
      path: ../nature-shared/core/consistency-sweep.md
    - condition: Results/main-text revisions need shortest sufficient evidence chain, main-versus-support allocation, or revision-accretion control
      path: ../nature-shared/core/main-text-discipline.md
