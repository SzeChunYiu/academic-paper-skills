name: nature-writing
version: 2.4.0
description: >
  Declarative manifest for journal-aware academic drafting, restructuring, and
  initial-submission requests. The legacy skill name is retained for backward
  compatibility; journal behavior is resolved independently from that name.
  Core drafting uses rhetorical moves and empirical cross-disciplinary evidence
  rather than a single journal skeleton, with optional editor/reviewer decision
  preflight. Substantial rewrites can study close analogue papers for writing,
  evidence, data, and figure conventions while preserving a separate author voice
  and research-backed natural scholarly prose.

always_load:
  - ../nature-shared/core/reader-workflow.md
  - ../nature-shared/core/paper-type-taxonomy.md
  - ../nature-shared/core/ethics.md
  - ../nature-shared/core/terminology-ledger.md
  - static/core/stance.md
  - static/core/rhetorical-engine.md
  - static/core/workflow.md
  - static/core/output-format.md

axes:
  task:
    detect: |
      Use submission-package when the user requests first-submission or
      pre-submission materials such as an initial cover letter, title page,
      highlights, author contributions, availability/declaration statements,
      reviewer suggestions, or a complete submission checklist. Use manuscript
      for manuscript sections and argument development. Revision correspondence
      after an editor decision belongs to nature-response, not this skill.
    values:
      manuscript:          static/fragments/task/manuscript.md
      submission-package: static/fragments/task/submission-package.md
    default: manuscript
    multi: false

  paper_type:
    detect: |
      Decide what kind of paper or section is being drafted. Default to research.
      Use the user's stated framing first; fall back to inference from their
      material. Map writing's older taxonomy (mechanism/method/resource/device/
      model/clinical/materials/computational/interdisciplinary) onto these five.
    values:
      research:       static/fragments/paper_type/research.md
      methods:        static/fragments/paper_type/methods.md
      hypothesis:     static/fragments/paper_type/hypothesis.md
      algorithmic:    static/fragments/paper_type/algorithmic.md
      review:         static/fragments/paper_type/review.md
    default: research
    multi: false

  section:
    detect: |
      Identify which section(s) the user wants drafted or rebuilt. The user
      may name one or several. Ask before loading when ambiguity materially
      changes the scientific argument or compliance result. Title and abstract
      often need to be drafted last but planned early.
    values:
      abstract:       static/fragments/section/abstract.md
      intro:          static/fragments/section/intro.md
      related-work:   static/fragments/section/related-work.md
      method:         static/fragments/section/method.md
      experiments:    static/fragments/section/experiments.md
      discussion:     static/fragments/section/discussion.md
      conclusion:     static/fragments/section/conclusion.md
      title:          static/fragments/section/title.md
    multi: true

  language:
    detect: |
      Detect the source language of the user's notes. Use zh-to-en when the
      input is Chinese, mixed Chinese-English, or organized as Chinese lab
      notes. Otherwise use en.
    values:
      en:             static/fragments/language/en.md
      zh-to-en:       static/fragments/language/zh-to-en.md
    default: en
    multi: false

  journal:
    detect: |
      Resolve the target independently from the legacy nature-writing skill name.
      Use nature only for flagship Nature, nat-comms only for Nature
      Communications, nat-mach-intell only for Nature Machine Intelligence, and
      nature-family for another Nature Portfolio title or an unresolved
      Nature-family request. Use profiled whenever the user names any other
      journal or journal/publisher/venue family. Use generic only when no target
      or useful family is known. For profiled targets, resolve exact journal ->
      article type -> stage -> component before exact compliance claims.
    values:
      nature:          static/fragments/journal/nature.md
      nature-family:   static/fragments/journal/nature-family.md
      nat-comms:       static/fragments/journal/nat-comms.md
      nat-mach-intell: static/fragments/journal/nat-mach-intell.md
      profiled:        static/fragments/journal/profiled.md
      generic:         static/fragments/journal/generic.md
    default: generic
    multi: false

references:
  on_demand:
    - condition: drafting or rewriting academic prose that feels generic, formulaic, over-smoothed, machine-like, repetitive, connector-heavy, weakly authorial, or difficult to follow sentence by sentence; use for proposition dependencies, given/new progression, identity chains, local stance, functional syntax, cadence, and anti-template repair without detector evasion
      path: ../nature-shared/core/natural-scholarly-prose.md
    - condition: substantial rewrite/drafting where the user wants to preserve a recognizable authorial style, cadence, agency, terminology, or manuscript-level voice after structural editing
      path: ../nature-shared/core/author-voice-profile.md
    - condition: rewrite/restructure where a few close similar papers should be studied for rhetorical architecture, evidence sequence, figure/data choices, plot expectations, main-text-versus-SI allocation, or current field/venue conventions without copying wording or visual identity
      path: ../nature-shared/core/analogue-paper-calibration.md
    - condition: any named non-Nature target journal, publisher/venue family, journal transfer, or exact cross-journal submission compliance request
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: any non-Nature publisher/venue/discipline family needs a fallback writing profile
      path: ../nature-shared/journal-formats/journal-family-profiles.md
    - condition: pre-submission editor/reviewer perspective, acceptance-readiness, desk-review risk, rejection-risk engineering, or deciding whether a concern needs more evidence versus claim narrowing/removal
      path: ../nature-shared/core/editor-reviewer-decision-engine.md
    - condition: target publication objective must be resolved across selective broad-interest, field-advancement, rigor-first, clinical/policy-priority, evidence-assessment, or conference-selection models
      path: ../nature-shared/journal-formats/editorial-decision-profiles.md
    - condition: author wants editor/reviewer preflight, acceptance engineering, likely decision blockers, minimum decisive experiments/analyses, or manuscript changes before submission
      path: references/editor-reviewer-preflight.md
    - condition: task is manuscript and the user is drafting, restructuring, or compressing Results or full main text; deciding what belongs in main text versus captions or SI; preventing revision accretion; reducing statistical or claim repetition; or building the shortest sufficient evidence chain
      path: ../nature-shared/core/main-text-discipline.md
    - condition: needs cross-disciplinary section structure, rhetorical move selection, argument order, or an alternative to a fixed Nature/IMRaD skeleton
      path: references/section-move-atlas.md
    - condition: needs empirical research support for a writing rule, disciplinary variation, syntax, titles, abstracts, Methods rhetoric, Discussion rhetoric, cohesion, paragraph flow, or corpus-grounded writing advice
      path: references/cross-disciplinary-writing-evidence.md
    - condition: needs concrete cross-venue counterexamples and direct-reading observations spanning Nature/NMI/npj, PLOS, JAMA, IEEE, eLife, and JMLR publication ecologies; especially to test whether a proposed writing rule is genuinely transferable
      path: references/direct-reading-notes-2025-2026.md
    - condition: user asks to learn current writing patterns from a named journal/venue or field, emulate recent comparable papers, build/update a local corpus profile, or diagnose why a scientifically correct draft does not resemble the target literature
      path: references/target-corpus-calibration.md
    - condition: analyzing dozens or hundreds of extracted .md/.txt papers for scalable section, paragraph, sentence, stance, connective, contribution-signal, or figure/table-call statistics before semantic move annotation
      path: scripts/corpus_structure_stats.py
    - condition: needs section-level architecture, argument order, or published-article patterns
      path: references/article-architecture.md
    - condition: genre-aware 2025 Nat Commun empirical structure, quantified connector/diction preferences, or research/review/perspective/comment/benchmark differences
      path: references/nat-comms-2025-corpus.md
    - condition: drafting/revising abstract; especially challenge-contribution forms
      path: references/abstract.md
    - condition: drafting/revising a Nature-family broad-audience summary paragraph or introduction opening
      path: references/nature-summary-paragraph.md
    - condition: drafting/revising introduction, research-need framing, prior-work positioning, contribution framing, or a method-heavy/algorithmic introduction
      path: references/introduction.md
    - condition: rebuilding related work as topic synthesis
      path: references/related-work.md
    - condition: writing Methods for any study design, including experimental, clinical, qualitative, computational, theoretical, or pipeline/module-based work
      path: references/method.md
    - condition: planning/writing experiments around baselines, ablations, metrics
      path: references/experiments.md
    - condition: writing a bounded conclusion with contribution, evidence, impact, limitation
      path: references/conclusion.md
    - condition: user asks whether a paragraph or section flows, has logic, feels choppy, needs transitions, or needs sentence-to-sentence / paragraph-to-paragraph coherence
      path: references/paragraph-flow.md
    - condition: final manuscript self-review, rejection-risk audit, claim-evidence alignment
      path: references/paper-review.md
    - condition: initial cover letter, title page, highlights, declarations, suggested reviewers, complete first-submission package, or submission-readiness audit
      path: references/submission-package.md
    - condition: flagship Nature Article formatting, initial-submission package, submission-readiness audit, stage classification, or exact title/text/display/reference limits
      path: ../nature-shared/journal-formats/nature.md
    - condition: Nature Machine Intelligence article-type selection, exact word/display limits, initial-submission package, stage classification, data/code duties, or production preflight
      path: ../nature-shared/journal-formats/nature-machine-intelligence.md
    - condition: human or animal ethics, clinical research, reporting summaries, image integrity, structures, chemistry, taxonomy, geological, archaeological, or palaeontological compliance is involved
      path: ../nature-shared/core/research-compliance.md
    - condition: deeper Chinese-author repair patterns beyond the language fragment
      path: references/chinese-author-workflow.md
    - condition: user wants concrete abstract/introduction/method examples
      path: references/examples/index.md
