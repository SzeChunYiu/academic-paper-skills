name: nature-shared
version: 2.7.0
description: >
  Declarative manifest for shared academic-paper reference modules. This package
  is not a standalone workflow; installed skills load exact shared core,
  research, or journal-format files on demand.

# Design note: never preload the whole shared package. Requesting skills should
# load only the specific file listed below and then return to their own workflow,
# output format, and QA rules.

always_load: []

core:
  on_demand:
    - condition: orchestrating a manuscript through repeated research, drafting, figures/statistics, independent review, editor synthesis, revision and targeted re-review until simulated publication readiness or a real blocker
      path: core/academic-paper-iteration-pipeline.md
    - condition: current paper type, study design, target venue, reporting norm, writing convention, figure grammar or review expectation is materially unfamiliar/uncertain and the session should research comparable papers/official guidance rather than force an existing template
      path: core/unknown-paper-research-protocol.md
    - condition: sentence-to-sentence or paragraph-to-paragraph logic is weak, prose reads like disconnected mini-summaries, evidence-to-inference or analysis-to-analysis handoffs are unclear, identity chains break, or reader-expectation/given-new/topic/stress principles should be applied without forcing a rigid template
      path: core/sentence-logic-and-cohesion.md
    - condition: shared ethics, safety, authorship, disclosure, or non-invention guardrails are needed
      path: core/ethics.md
    - condition: human or animal ethics, clinical research, reporting summaries, image integrity, structures, chemistry, taxonomy, geological, archaeological, or palaeontological compliance is involved
      path: core/research-compliance.md
    - condition: classifying paper type, article genre, or manuscript family before applying a writing/reader workflow
      path: core/paper-type-taxonomy.md
    - condition: resolving the manuscript's dominant epistemic archetype across mechanism/discovery, randomized intervention, observational association, computational/ML, method/tool/software, dataset/resource, theory/proof, qualitative/interpretive, review/synthesis, or hybrid forms so writing/evidence/figure expectations are calibrated by scientific job rather than journal prestige
      path: core/paper-archetype-atlas.md
    - condition: shared reader workflow is explicitly requested by another academic-paper skill
      path: core/reader-workflow.md
    - condition: full manuscript, theory/proof section, submission-ready deliverable, public posting, or decision-relevant revision requires a fail-closed inventory of every atomic scientific assertion, definition, proof dependency, numerical claim, source claim, availability statement, and cross-section restatement
      path: core/atomic-claim-verification.md
    - condition: maintaining terminology consistency across paper reading, polishing, writing, or slide generation
      path: core/terminology-ledger.md
    - condition: rewriting or polishing substantial author-provided prose while preserving a recognizable authorial cadence, agency, terminology, stance, or manuscript-level voice
      path: core/author-voice-profile.md
    - condition: drafting, rewriting, or polishing academic prose that feels generic, formulaic, over-smoothed, machine-like, choppy, repetitive, connector-heavy, weakly authorial, or difficult to follow sentence by sentence; use for natural scholarly cadence and sentence-flow repair, never detector evasion
      path: core/natural-scholarly-prose.md
    - condition: checking whether a manuscript idea, method, mechanism, result, equation, figure interpretation, or implication is explained deeply enough for the intended reader; especially when prose is concise but assumes hidden premises, names concepts without rationale, jumps from observation to conclusion, or compresses a central idea into too little explanation
      path: core/explanatory-sufficiency.md
    - condition: studying a few close analogue papers before rewriting, restructuring evidence, choosing main figures, deciding what data belongs in main text versus SI, or learning field/venue conventions without copying wording or visual identity
      path: core/analogue-paper-calibration.md
    - condition: deciding what information belongs in main text, figures, legends, Methods, Extended Data/SI, availability statements, repository documentation, or nowhere; especially when codebase/repository details, file paths, helper names, setup commands, project links, exhaustive technical detail, or implementation documentation are leaking into manuscript prose
      path: core/manuscript-content-selection.md
    - condition: deciding what figures/plots a paper needs, suggesting visual evidence for claims, mapping reader questions and estimands to plot families, or planning main versus supporting figure roles before rendering
      path: core/figure-evidence-planning.md
    - condition: binding a plot, figure, table, image plate, diagram, or mixed display to its reader task, estimand, statistical unit, candidate representation, inference boundary, data/analysis/render/source-data provenance, caption, accessibility, and stage-specific exit tests
      path: core/scientific-display-decision-contract.md
    - condition: binding a study to versioned protocol and analysis-plan timing, executed conduct, deviations, ethics/governance, raw-data/analysis receipts, and claim-status boundaries before Methods/Results drafting or readiness assessment
      path: core/study-protocol-conduct-contract.md
    - condition: binding scientific data from source/acquisition through immutable raw, validated and analysis-ready snapshots, QC and transformation receipts, analysis/display inputs, governance, release, deviations, and bounded claims before downstream writing or readiness assessment
      path: core/data-integrity-stewardship-contract.md
    - condition: binding questions and claims through estimands, independent units/dependence, analysis populations, immutable inputs, executed analyses, diagnostics/sensitivity, typed uncertainty, cross-surface values, exact policy dates, and bounded inference before quantitative Results, displays, or readiness assessment
      path: core/statistical-inference-uncertainty-contract.md
    - condition: final manuscript-facing QA after drafting, including a last-mile scrub for filenames, file paths, script/helper/class names, CLI flags, repository/developer history, raw project links, output filenames, figure-legend leakage, punctuation/spacing/bracket defects, range/minus/hyphen review, and target-aware scientific copy-editing
      path: core/manuscript-surface-qa.md
    - condition: auditing an existing or multi-round-revised manuscript for accumulated drift — terminology/unit/number variants, headline counts that do not reconcile with the Methods, claims contradicted by the paper's own tables, over- or under-claiming, tense parallelism, and prose that restates displays
      path: core/consistency-sweep.md
    - condition: drafting, restructuring, compressing, or reviewer-revising scientific main text — classify results as core/support/qualification/robustness/heterogeneity/provenance/alternative inference/edge case; allocate evidence across main text, captions, and SI; run paragraph-necessity, deletion, statistics-location, and claim-repetition checks
      path: core/main-text-discipline.md
    - condition: pre-submission editor/reviewer simulation, rejection-risk engineering, decision-proof construction, major-revision planning, or deciding whether to add evidence versus narrow/remove a claim
      path: core/editor-reviewer-decision-engine.md

research:
  on_demand:
    - condition: recent stratified cross-archetype examples are needed to challenge a local paper/figure/writing assumption across mechanism, trial, computational, resource, qualitative, theory and review papers
      path: research/stratified-paper-reading-2025-2026.md
    - condition: the empirical and methodological basis, transfer boundary, contradiction, or unresolved research gap behind a scientific display adapter or automatic display blocker must be inspected
      path: research/scientific-display-evidence-ledger-2026-08.md
    - condition: the empirical, methodological, or reporting-standard basis behind a study protocol/conduct adapter, automatic blocker, repair route, or non-universal transfer boundary must be inspected
      path: research/study-protocol-conduct-evidence-ledger-2026-08.md
    - condition: the empirical, standard, governance, or policy basis behind a data integrity/stewardship adapter, automatic blocker, repair boundary, exact-domain obligation, or release route must be inspected
      path: research/data-integrity-stewardship-evidence-ledger-2026-08.md
    - condition: the statistical, methodological, reporting, or policy basis behind an inference/uncertainty adapter, automatic blocker, repair boundary, exact-analysis obligation, or certification exclusion must be inspected
      path: research/statistical-inference-uncertainty-evidence-ledger-2026-08.md

journal_formats:
  on_demand:
    - condition: resolving the exact target journal, article type, stage, and output component before applying journal-specific rules
      path: journal-formats/journal-resolution.md
    - condition: resolving a target-specific acceptance objective, scientific and target gates, burden-of-doubt rule, repair routes, review model, AI/confidentiality policy, acceptance states, certification layer, or time-versioned official-source provenance
      path: journal-formats/venue-decision-contract.md
    - condition: a non-exact publisher/venue/discipline family profile is needed as a fallback
      path: journal-formats/journal-family-profiles.md
    - condition: resolving whether the target uses selective broad-interest, field-advancement, rigor-first, clinical/policy-priority, evidence-assessment, or deadline-constrained editorial decision logic
      path: journal-formats/editorial-decision-profiles.md
    - condition: formatting, initial-submission readiness, or stage-aware checking for a flagship Nature Article
      path: journal-formats/nature.md
    - condition: formatting or checking output for Nature Communications conventions
      path: journal-formats/nat-comms.md
    - condition: formatting, article-type selection, initial-submission readiness, or stage-aware checking for Nature Machine Intelligence
      path: journal-formats/nature-machine-intelligence.md

quality_tools:
  consistency_script: scripts/check_consistency.py
  consistency_use_when: auditing an existing full manuscript or a manuscript revised over multiple rounds
  consistency_purpose: warn about terminology variants, equivalent lengths expressed in different units, and equal numeric values reported at different precision
  manuscript_surface_script: scripts/audit_manuscript_surface.py
  manuscript_surface_use_when: final plain-text/Markdown manuscript, legend, caption, table-note, abstract, or section QA after scientific drafting is stable
  manuscript_surface_purpose: conservatively flag repository/artifact leakage, high-confidence mechanical punctuation defects, stage-aware submission placeholders, abstract display-math review, opaque/unexpanded identifier candidates, and paper-private Greek/alphanumeric symbols without auto-rewriting meaning-sensitive language; use fail-on-review only as a candidate gate before ledger adjudication
  script_resolution: resolve relative to the nature-shared package directory, never the user working directory
  scientific_display_script: scripts/resolve_scientific_display.py
  scientific_display_schema: display-contracts/scientific-display-contract.schema.json
  scientific_display_adapters: display-contracts/maintained-adapters.json
  scientific_display_purpose: return evidence-informed candidate representations rather than a universal best chart, then fail closed on high-risk provenance, inference-boundary, omission, caption, uncertainty, and accessibility defects
  study_protocol_script: scripts/resolve_study_protocol.py
  study_protocol_schema: study-contracts/study-protocol-conduct-contract.schema.json
  study_protocol_adapters: study-contracts/maintained-study-adapters.json
  study_protocol_purpose: return study-type obligations rather than a universal best design, then fail closed on high-risk timing, outcome, execution, deviation, leakage, ethics, and claim-status contradictions
  data_integrity_script: scripts/resolve_data_integrity.py
  data_integrity_schema: data-contracts/data-integrity-stewardship-contract.schema.json
  data_integrity_adapters: data-contracts/maintained-data-adapters.json
  data_integrity_purpose: return modality/governance obligations rather than a universal data-quality score, then fail closed on high-risk raw-snapshot, lineage, QC, analysis-input, decision, authority, rights, and release contradictions
  statistical_inference_script: scripts/resolve_statistical_inference.py
  statistical_inference_schema: analysis-contracts/statistical-inference-uncertainty-contract.schema.json
  statistical_inference_adapters: analysis-contracts/maintained-analysis-adapters.json
  statistical_inference_purpose: return applicable obligations rather than a universal best method, then fail closed on recorded unit/dependence, plan/execution, uncertainty, inference-boundary, cross-surface, policy-date, and receipt contradictions
