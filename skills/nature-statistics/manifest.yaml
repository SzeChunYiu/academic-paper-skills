name: nature-statistics
version: 1.4.0
description: >
  Declarative manifest for bounded statistical inference, uncertainty, and
  reporting work. SKILL.md loads the shared analysis contract while keeping
  specialized risk and exact-target checklists on demand.

# Design note: nature-statistics is a conservative reporting/audit skill. The
# default path always needs source hierarchy and minimum reporting requirements,
# but heavier risk catalogs should stay on demand so a simple Statistical
# analysis rewrite does not load every checklist.

always_load:
  - ../nature-shared/core/statistical-inference-uncertainty-contract.md
  - references/source-basis.md
  - references/statistical-reporting.md

references:
  on_demand:
    - condition: the evidence, contradiction, transfer boundary, domain adapter, policy provenance, or repair route behind an inference/uncertainty decision needs inspection
      path: ../nature-shared/research/statistical-inference-uncertainty-evidence-ledger-2026-08.md
    - condition: target is the flagship journal Nature, or the user requests an exact Nature Article statistical submission/readiness audit
      path: references/nature-article-requirements.md
    - condition: target is Nature Machine Intelligence, or exact NMI legend statistics, source-data, reporting-summary, data/code, initial-submission, or production requirements affect the audit
      path: ../nature-shared/journal-formats/nature-machine-intelligence.md
    - condition: nested data, pseudoreplication, repeated measures, many comparisons, correlations, regressions, outliers, small samples, or overstrong p-value language
      path: references/common-failure-modes.md
    - condition: checking figure legends, panel-level n, error bars, stars, box/violin plots, source-data notes, or statistical annotations
      path: references/figure-statistics.md
    - condition: final audit QA, severity labeling, reviewer-risk summary, or response-to-reviewer drafting
      path: references/reviewer-checklist.md
    - condition: the same statistic is reported in more than one place, or interval terminology is in question — one metric at two precisions across table and text, SD/Std and similar abbreviation drift, confidence interval used where prediction interval is meant, and overlapping error bars described as outperformance
      path: ../nature-shared/core/consistency-sweep.md
