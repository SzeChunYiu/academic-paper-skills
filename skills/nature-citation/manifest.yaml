name: nature-citation
version: 3.2.0
description: >
  Declarative manifest for journal-agnostic evidence discovery plus optional
  explicit Nature/Science/Cell-family filtering. The legacy skill name is
  retained for backward compatibility. Evidence scope, publication-version
  quality, and bibliography rendering style are separate decisions.

always_load:
  - static/core/principles.md
  - static/core/chinese-mode.md
  - static/core/workflow.md
  - ../nature-shared/core/research-integrity-verification.md
  - ../nature-shared/core/literature-version-and-source-quality.md

runtime:
  default_scope: best-evidence
  general_script: scripts/academic_citation_search.py
  legacy_family_script: scripts/nature_citation.py
  integrity_verifier: ../nature-shared/scripts/verify_research_integrity.py
  behavior: |
    General requests for references, citation support, or literature use
    best-evidence and MUST NOT silently inherit a Nature/CNS filter from the
    skill name. Use the legacy family script or a restricted --scope only when
    the user explicitly requests Nature Portfolio, Science family, Cell Press,
    CNS/sister journals, or flagship-only sources. A named target journal affects
    citation rendering/compliance; it restricts evidence search only when the
    user asks for same-journal or journal-filtered sources. For manuscript-facing
    citations, candidate discovery is not verification: bind each cited atomic
    claim to inspected evidence and run the shared research-integrity gate before
    any submission/publication-ready state. Before retaining a preprint, audit
    whether a peer-reviewed version of record or proceedings version of the same
    work exists; prefer that formal version whenever appropriate while preserving
    legitimate frontier-preprint and field-specific conference exceptions.

references:
  on_demand:
    - condition: manuscript-facing citations need machine-checkable claim-to-source receipts, source identity/status verification, independent checking, or release gating
      path: ../nature-shared/analysis-contracts/research-integrity-ledger.schema.json
    - condition: any named target journal or citation style needs submission-ready rendering or exact reference-format compliance
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: a target publisher/venue family needs fallback context before an exact guide is available
      path: ../nature-shared/journal-formats/journal-family-profiles.md
    - condition: running the general journal-agnostic search/export route
      path: scripts/academic_citation_search.py
    - condition: running the legacy Nature/Science/Cell family search/export route, full legacy flags, or HTML review artifacts
      path: references/script-usage.md
    - condition: translating a manuscript claim into search queries and support grades
      path: references/search-strategy.md
    - condition: the explicit Nature/CNS journal-family boundary and official source notes
      path: references/journal-scope.md
    - condition: RIS, EndNote, or Zotero RDF export guidance
      path: references/ris-endnote.md
    - condition: legacy segment search, Crossref family filters, DOI/PMID metadata retrieval, ENW/RIS/RDF export, or HTML browser generation
      path: scripts/nature_citation.py
