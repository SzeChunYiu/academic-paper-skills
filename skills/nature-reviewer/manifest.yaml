name: nature-reviewer
version: 2.8.0
description: >
  Declarative manifest for journal-aware pre-submission editor/reviewer
  simulation. The legacy skill name remains for compatibility; review criteria
  are resolved from the exact target journal/publication model rather than
  assuming flagship Nature. Close analogue papers may inform field-specific
  evidence expectations but never substitute for official criteria or manuscript facts.
  Review also checks evidence-graded acceptance optimization, journal acceptance-
  readiness, adversarial falsification and confirmation-bias control, editorial
  routing/expertise, archetype-appropriate evidence/figure architecture,
  explanation sufficiency, manuscript/artifact allocation, and final manuscript-
  surface leakage/punctuation hygiene without confusing copy-editing with science.

always_load:
  - references/source-basis.md
  - ../nature-shared/core/editor-reviewer-decision-engine.md
  - ../nature-shared/core/adversarial-review-bias-control.md

references:
  on_demand:
    - condition: full manuscript or theory/proof claim needs a coverage-complete inventory of atomic assertions, definitions, proof dependencies, numerical/source/availability claims, contradictions, and fail-closed release statuses; each blind reviewer must perform this independently rather than receiving a shared adjudicated ledger
      path: ../nature-shared/core/atomic-claim-verification.md
    - condition: reviewer/editor should resolve the dominant paper archetype and ask whether evidence, explanation depth and main-figure roles fit a mechanism/discovery, trial/intervention, observational, computational/ML, method/tool/software, resource/dataset, theory/proof, qualitative, review/synthesis or hybrid scientific promise
      path: ../nature-shared/core/paper-archetype-atlas.md
    - condition: reviewer/editor should inspect recent cross-archetype counterexamples before treating one field/journal pattern as universal
      path: ../nature-shared/research/stratified-paper-reading-2025-2026.md
    - condition: reviewer/editor should assess whether a central idea, method, mechanism, result, equation, figure interpretation, or implication is under-explained; whether hidden premises prevent readers from reconstructing the evidence-to-claim chain; or whether the paper is so compressed that technically capable readers must guess rationale, meaning, or boundaries
      path: ../nature-shared/core/explanatory-sufficiency.md
    - condition: reviewer/editor should assess whether source-code/repository/project details are cluttering the scientific narrative, whether decisive evidence is buried in Methods/SI, or whether content belongs in main text, figures, legends, Methods, availability, artifact docs, or should be omitted
      path: ../nature-shared/core/manuscript-content-selection.md
    - condition: reviewer/editor should assess whether filenames, script/helper names, file paths, raw repository links, CLI/developer residue, figure-caption artifact leakage, or punctuation/spacing/bracket defects remain on manuscript-facing surfaces; classify ordinary copy-editing as clarity/reporting unless it changes meaning or scientific identity
      path: ../nature-shared/core/manuscript-surface-qa.md
    - condition: reviewer/editor should assess whether the figure set actually supports headline claims, which plots/evidence roles are missing, whether pooled summaries hide heterogeneity/pairing/calibration/failure boundaries, or what visual evidence would close a decision-relevant concern
      path: ../nature-shared/core/figure-evidence-planning.md
    - condition: user asks how comparable papers establish similar claims, what evidence/figures reviewers in this paper class may expect, or whether the manuscript's evidence architecture is unusual relative to close analogues; use as context only, not publication policy
      path: ../nature-shared/core/analogue-paper-calibration.md
    - condition: target journal/venue is named, journal fit or desk-review risk is being assessed, or exact publication criteria matter
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: target-specific decision readiness should be audited across science/integrity, scope, contribution/readership, evidence maturity, editorial triage, reviewer coverage, editor synthesis, revision closure, cover letter, and retargeting without acceptance prediction
      path: ../nature-shared/core/journal-acceptance-readiness.md
    - condition: reviewer/editor should test whether the manuscript has been acceptance-optimized using evidence-graded levers from research-question design through evidence maturation, target fit, desk preflight, submission package, review, revision and retargeting, without numeric acceptance scoring or individual targeting
      path: ../nature-shared/core/acceptance-optimization-protocol.md
    - condition: reviewer/editor should learn from comparable public review histories how concerns were actually closed by evidence, reanalysis, claim narrowing, figure/table changes, explanation or rebuttal, while explicitly controlling survivorship bias and pairing accepted cases with rejection evidence
      path: ../nature-shared/core/public-review-history-calibration.md
    - condition: evidence grade, source-specific support, causal boundary, Registered Report route, rejection-report basis, novelty/conventionality association, statistical-review intervention, revision trajectory or public-history limitation behind an acceptance recommendation needs inspection
      path: ../nature-shared/research/acceptance-optimization-evidence-ledger-2026-08-29.md
    - condition: public editor identities, teams, sections, professional expertise, conflicts, or permitted editor suggestions are relevant to routing; use only professional expertise and official workflow rules, never presumed leniency or favorability
      path: ../nature-shared/core/editor-expertise-routing.md
    - condition: source-specific evidence is needed for editorial triage, desk-rejection variability, editor expertise routing, reviewer disagreement, cover-letter boundaries, novelty/acceptance, or anti-gaming safeguards
      path: ../nature-shared/research/journal-acceptance-editorial-decision-research-2026-08-29.md
    - condition: target publication model must be resolved as selective broad-interest, field-advancement, rigor-first, clinical/policy-priority, evidence-assessment, or deadline-constrained
      path: ../nature-shared/journal-formats/editorial-decision-profiles.md
    - condition: exact target is flagship Nature or the user explicitly asks for Nature editorial/referee criteria
      path: references/editorial criteria and processes.md
    - condition: executing the full editor-triage plus isolated-review workflow, preparing immutable reviewer inputs, or resolving assessment order
      path: references/reviewer-workflow.md
    - condition: weighting universal scientific axes and target-conditional originality/significance/readership/advancement/clinical-priority axes
      path: references/review-axes.md
    - condition: building the internal concern ledger, calibrating Major/Minor severity and Blocking status, checking technical coverage, or anchoring concerns to manuscript claims and evidence locations
      path: references/technical-concern-taxonomy.md
    - condition: manuscript is clearly in chemistry, engineering, materials, atmospheric science, climate-ecology, hydrology, or remote sensing
      path: references/domain-specific-review-gates.md
    - condition: composing or auditing editorial triage, mutually blind reviewer reports, Blocking flags, editor synthesis, or the author-facing decision-engineering map
      path: references/report-structure.md
    - condition: enforcing reviewer mutual blindness, separating simulated editor and reviewer authority, or preventing invented identities/hidden editorial knowledge
      path: references/role-boundaries.md
    - condition: final reviewer-isolation, severity, blocking, groundedness, target-criteria, non-invention, coverage, and decision-engineering QA before delivery
      path: references/qa-checklist.md
    - condition: checking the manuscript against itself — headline counts that do not reconcile with Methods, metric precision drift, claims contradicted by tables, or internal summaries that disagree
      path: ../nature-shared/core/consistency-sweep.md
