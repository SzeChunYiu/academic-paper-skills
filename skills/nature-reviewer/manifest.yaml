name: nature-reviewer
version: 3.3.0
description: >
  Journal-aware pre-submission editor/reviewer simulation optimized for focused
  AI review sessions. The reviewer always carries a compact execution kernel,
  context router, source-basis, decision engine and adversarial-bias controls;
  detailed abstract, section, statistics, formal, target and release contracts
  are loaded only when the review question requires them.

always_load:
  - ../nature-shared/core/ai-session-execution-kernel.md
  - ../nature-shared/core/ai-session-context-routing.md
  - references/source-basis.md
  - ../nature-shared/core/editor-reviewer-decision-engine.md
  - ../nature-shared/core/adversarial-review-bias-control.md

references:
  on_demand:
    - condition: long-running review/re-review needs a compact checkpoint with current scope, blocker IDs, resolution tests, required contracts, next action and stop condition
      path: ../nature-shared/analysis-contracts/ai-session-checkpoint.schema.json
    - condition: a reviewer/session checkpoint should be validated before resume or handoff
      path: ../nature-shared/scripts/verify_ai_session_checkpoint.py
    - condition: inspect evidence behind lean context, progressive disclosure, delta-first revision and stage-specific reviewer context routing
      path: ../nature-shared/research/ai-session-context-engineering-evidence-2026-08-31.md
    - condition: reviewer/editor needs whole-paper communication/readiness evaluation beyond technical validity
      path: ../nature-shared/core/manuscript-excellence-release-gate.md
    - condition: reviewer/editor is judging abstract self-containment, numerical salience, information density or abstract/body consistency
      path: ../nature-shared/core/abstract-information-budget.md
    - condition: reviewer/editor needs section-specific reader jobs, failure modes or exit tests
      path: ../nature-shared/core/manuscript-section-craftsmanship.md
    - condition: reviewer/editor must resolve the dominant paper archetype and judge evidence, explanation depth and display roles against that scientific promise rather than a universal paper template
      path: ../nature-shared/core/paper-archetype-atlas.md
    - condition: reviewer/editor must judge target-specific word/page/display/reference allocation or opportunity cost
      path: ../nature-shared/core/venue-constrained-manuscript-budget.md
    - condition: reviewer/editor must judge whole-paper argument dependency, reader-state activation, Results ordering or Discussion architecture
      path: ../nature-shared/core/manuscript-narrative-architecture.md
    - condition: reviewer/editor must judge claim stance, defensive qualification or positive-claim visibility
      path: ../nature-shared/core/epistemic-rhetoric-and-qualification.md
    - condition: reviewer/editor must judge numerical precision, significant figures, intervals, P values or cross-surface rounding
      path: ../nature-shared/core/numerical-reporting-precision.md
    - condition: reviewer/editor must judge standalone zero-context comprehension or project/private vocabulary leakage
      path: ../nature-shared/core/standalone-manuscript-reader-contract.md
    - condition: reviewer/editor must judge source maturity, preprint/version-of-record status or publication-version identity
      path: ../nature-shared/core/literature-version-and-source-quality.md
    - condition: reviewer/editor must independently inventory atomic claims, definitions, proof dependencies, numerical/source/availability claims or contradictions
      path: ../nature-shared/core/atomic-claim-verification.md
    - condition: reviewer/editor must judge contribution-defining formal objects, proofs, bounds, non-implications or formal hierarchy
      path: ../nature-shared/core/formal-spine-preservation.md
    - condition: reviewer/editor must judge explanatory sufficiency when hidden premises prevent readers from reconstructing the evidence-to-claim chain or technically capable readers must guess rationale, mechanism, meaning or boundaries
      path: ../nature-shared/core/explanatory-sufficiency.md
    - condition: reviewer/editor must judge main text versus Methods/SI/artifact allocation or repository-shaped narrative clutter
      path: ../nature-shared/core/manuscript-content-selection.md
    - condition: reviewer/editor must judge figure/evidence architecture or identify missing visual evidence
      path: ../nature-shared/core/figure-evidence-planning.md
    - condition: reviewer/editor needs close-paper evidence/explanation/figure/section-proportion calibration; use analogues as context only, not publication policy
      path: ../nature-shared/core/analogue-paper-calibration.md
    - condition: reviewer/editor needs recent cross-archetype counterexamples before treating one field or venue pattern as universal
      path: ../nature-shared/research/stratified-paper-reading-2025-2026.md
    - condition: exact target journal/venue/article type/stage or current author instructions matter
      path: ../nature-shared/journal-formats/journal-resolution.md
    - condition: target-specific decision criteria, policy date, burden of doubt, review model or AI/confidentiality policy matters
      path: ../nature-shared/journal-formats/venue-decision-contract.md
    - condition: target publication model needs fallback classification when exact editorial decision rules are unavailable
      path: ../nature-shared/journal-formats/editorial-decision-profiles.md
    - condition: target-specific acceptance readiness, fit, triage, evidence maturity or retargeting is being assessed
      path: ../nature-shared/core/journal-acceptance-readiness.md
    - condition: legitimate publication opportunity and evidence-backed acceptance levers are being reviewed without gaming or numeric acceptance prediction
      path: ../nature-shared/core/acceptance-optimization-protocol.md
    - condition: comparable public review histories should be studied for concern-to-repair patterns; pair accepted histories with rejection evidence and control survivorship bias
      path: ../nature-shared/core/public-review-history-calibration.md
    - condition: source-specific evidence grades or causal limits behind acceptance optimization and public review-history calibration need inspection
      path: ../nature-shared/research/acceptance-optimization-evidence-ledger-2026-08-29.md
    - condition: public editor identities, teams, sections, professional expertise, conflicts or permitted editor suggestions matter; use expertise only, never presumed leniency or favorability
      path: ../nature-shared/core/editor-expertise-routing.md
    - condition: evidence behind desk triage, editor expertise routing, reviewer disagreement, cover letters, novelty and anti-gaming safeguards needs inspection
      path: ../nature-shared/research/journal-acceptance-editorial-decision-research-2026-08-29.md
    - condition: manuscript needs cross-section terminology/unit/number/claim consistency checking
      path: ../nature-shared/core/consistency-sweep.md
    - condition: manuscript needs final source/render publication-surface QA; classify ordinary copy-editing as clarity/reporting unless it changes meaning or scientific identity
      path: ../nature-shared/core/manuscript-surface-qa.md
    - condition: abstract needs conservative automated density/precision/private-ID/word-limit/reference scanning
      path: ../nature-shared/scripts/audit_abstract_information.py
    - condition: manuscript needs conservative narrative/precision/defensiveness/deferred-reader-activation scanning
      path: ../nature-shared/scripts/audit_narrative_precision.py
    - condition: manuscript needs conservative standalone/private-vocabulary/repository-leakage/preprint-concentration scanning
      path: ../nature-shared/scripts/audit_standalone_manuscript.py
    - condition: manuscript needs conservative scholarly-surface/markup/code-font/raw-math/table/render scanning
      path: ../nature-shared/scripts/audit_scholarly_surface_semantics.py
    - condition: reviewer/editor needs deterministic target-budget validation
      path: ../nature-shared/scripts/verify_manuscript_budget.py
    - condition: reviewer/editor needs section-specific academic-writing evidence and transfer limits
      path: ../nature-shared/research/section-specific-academic-writing-evidence-2026-08-31.md
    - condition: reviewer/editor needs evidence behind narrative architecture, discussion, AI-writing risks or numerical precision
      path: ../nature-shared/research/excellent-academic-writing-ai-failure-evidence-2026-08-31.md
    - condition: exact target is flagship Nature or the user explicitly asks for Nature editorial/referee criteria
      path: references/editorial criteria and processes.md
    - condition: executing the full editor-triage plus isolated-review workflow or preparing immutable reviewer inputs
      path: references/reviewer-workflow.md
    - condition: weighting universal scientific axes and target-conditional originality/significance/readership/advancement/clinical-priority axes
      path: references/review-axes.md
    - condition: building the internal concern ledger, calibrating Major/Minor severity or checking blocking technical coverage
      path: references/technical-concern-taxonomy.md
    - condition: manuscript is clearly in chemistry, engineering, materials, atmospheric science, climate-ecology, hydrology or remote sensing
      path: references/domain-specific-review-gates.md
    - condition: composing or auditing editorial triage, mutually blind reviewer reports, Blocking flags, editor synthesis or author-facing decision map
      path: references/report-structure.md
    - condition: enforcing reviewer mutual blindness, simulated editor/reviewer authority boundaries or non-invention
      path: references/role-boundaries.md
    - condition: final reviewer-isolation, severity, groundedness, target-criteria and decision-engineering QA before delivery
      path: references/qa-checklist.md
